<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTR Management</title>
  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2980b9;
      --background-color: #f5f7fa;
      --text-color: #333;
      --light-text: #777;
      --border-color: #e0e0e0;
      --success-color: #2ecc71;
      --header-bg: #ffffff;
      --row-bg: #ffffff;
      --row-alt-bg: #f9f9f9;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h2 {
      color: var(--primary-color);
      font-size: 28px;
      font-weight: 600;
    }

    .back-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-button:hover {
      background-color: var(--secondary-color);
      transform: translateY(-2px);
    }

    .back-button:active {
      transform: translateY(0);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--header-bg);
      box-shadow: var(--shadow);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--primary-color);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 14px;
    }

    tr:nth-child(even) {
      background-color: var(--row-alt-bg);
    }

    tr:hover {
      background-color: #f0f0f0;
    }

    td {
      color: var(--text-color);
    }

    .amount {
      font-weight: 600;
      color: var(--success-color);
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      h2 {
        font-size: 22px;
      }

      .back-button {
        padding: 8px 15px;
        font-size: 14px;
      }

      table {
        display: block;
        overflow-x: auto;
      }

      th, td {
        padding: 12px 8px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      th, td {
        padding: 10px 6px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>UTR Management</h2>
      <button class="back-button" onclick="window.history.back()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
        </svg>
        Back
      </button>
    </div>

    <table>
      <thead>
        <tr>
          <th>UTR Number</th>
          <th>Withdrawal Amount</th>
          <th>Created At</th>
        </tr>
      </thead>
      <tbody>
        <% utrs.forEach(utr => { %>
          <tr>
            <td><%= utr.utrNumber %></td>
            <td class="amount">₹<%= utr.withdrawalId.amount %></td>
            <td><%= new Date(utr.createdAt).toLocaleString() %></td>
          </tr>
        <% }); %>
      </tbody>
    </table>
  </div>

  <script>
    // Add any JavaScript functionality here if needed
  </script>
</body>
</html>
