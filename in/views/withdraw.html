<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Withdraw</h1>
        <form id="withdrawForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="qrImage">Upload Your QR Code</label>
                <input type="file" id="qrImage" name="qrImage" accept="image/*" required>
            </div>
            <button type="submit">Submit Withdrawal</button>
        </form>
        <button onclick="location.href='/home'">Back to Home</button>
    </div>
    <script src="/js/script.js"></script>
</body>
</html>
