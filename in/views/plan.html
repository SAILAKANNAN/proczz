<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-container">
    <h1>Plan</h1>
    <a href="/admin" class="back-btn">← Back to Admin</a>
    <form id="planForm">
      <div class="form-group">
        <label for="amount">Plan Amount</label>
        <input type="number" id="amount" name="amount" required>
      </div>
      <div class="form-group">
        <label for="duration">Plan Duration (days)</label>
        <input type="number" id="duration" name="duration" required>
      </div>
      <div class="form-group">
        <label for="interest">Interest (%)</label>
        <input type="number" id="interest" name="interest" step="0.01" required>
      </div>
      <div class="form-group">
        <label for="winningAmount">Winning Amount</label>
        <input type="number" id="winningAmount" name="winningAmount" required>
      </div>
      <button type="submit" class="btn">Add Plan</button>
    </form>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
