<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-container">
    <h1>Users</h1>
    <a href="/admin" class="back-btn">← Back to Admin</a>
    <table>
      <thead>
        <tr>
          <th>Phone</th>
          <th>Name</th>
          <th>Balance</th>
          <th>Created At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <% users.forEach(user => { %>
          <tr>
            <td><%= user.phone %></td>
            <td><%= user.name %></td>
            <td>₹<%= user.balance %></td>
            <td><%= new Date(user.createdAt).toLocaleString() %></td>
            <td>
              <form action="/admin/users/add-balance/<%= user._id %>" method="POST" class="inline-form">
                <input type="number" name="amount" min="0" step="0.01" required>
                <button type="submit" class="btn small">Add</button>
              </form>
              <form action="/admin/users/delete/<%= user._id %>" method="POST" class="inline-form">
                <button type="submit" class="btn small danger">Delete</button>
              </form>
            </td>
          </tr>
        <% }); %>
      </tbody>
    </table>
  </div>
</body>
</html>
